[project]
name = "honest-agent"
version = "0.1.0"
description = "Multi-tenant embeddable AI support assistant: grounded answers, honest refusal, injection-resistant."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "pydantic-ai",
    "structlog",
    "logfire[fastapi]",
    "sentry-sdk[fastapi]",
    "httpx",
    "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pre-commit",
]

[tool.uv]
# cryptography >= 49 ships no x86_64 macOS wheel, so on an Intel Mac it falls back
# to a Rust source build that cannot complete here. Cap at the newest version that
# still ships an Intel-macOS wheel. Pulled in transitively via
# pydantic-ai -> fastmcp-slim[client] -> authlib.
constraint-dependencies = ["cryptography<49"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# asyncpg ships no type stubs or py.typed marker; allow the import without
# weakening strictness anywhere else.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs real services (Postgres, Weaviate) in Docker",
    "eval: DeepEval golden-set run that calls the model; its own CI job",
]
addopts = "--import-mode=importlib --cov=app --cov-report=term-missing --cov-report=html"
